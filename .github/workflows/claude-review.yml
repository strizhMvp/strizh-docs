# Ревью pull request: размер PR и Claude как ревьюер.
# Эталон лежит в strizh-infra/workflow-templates/claude-review.yml и копируется без изменений
# в .github/workflows/ каждого репозитория strizhMvp; правится сначала эталон.
#
# Настройка владельцем: установить GitHub App Claude на организацию (https://github.com/apps/claude)
# и добавить секрет организации CLAUDE_CODE_OAUTH_TOKEN (`claude setup-token`, Pro / Max)
# или ANTHROPIC_API_KEY. Без секрета ревью пропускается с notice, проверка размера работает всегда.
name: claude-review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened, labeled, unlabeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

env:
  CLAUDE_AUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}${{ secrets.ANTHROPIC_API_KEY }}
  # Правила малых PR (CONTRIBUTING организации): ориентир и жёсткий предел изменённых строк
  # без lock-файлов; метка large-pr снимает предел для согласованных исключений.
  PR_SOFT_LIMIT: 400
  PR_HARD_LIMIT: 800
  # Только чтение и комментарии: без правок файлов и git.
  REVIEW_TOOLS: >-
    mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh issue view:*)

jobs:
  size:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Count changed lines
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          LARGE_OK: ${{ contains(github.event.pull_request.labels.*.name, 'large-pr') }}
        run: |
          lines=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json files --jq '
            [.files[] | select(.path | test("(^|/)(package-lock[.]json|pnpm-lock[.]yaml|yarn[.]lock|uv[.]lock|poetry[.]lock)$") | not)
             | .additions + .deletions] | add // 0')
          echo "Изменено строк без lock-файлов: $lines (ориентир $PR_SOFT_LIMIT, предел $PR_HARD_LIMIT)"
          if [ "$lines" -gt "$PR_HARD_LIMIT" ]; then
            if [ "$LARGE_OK" = "true" ]; then
              echo "::warning::PR на $lines строк, предел снят меткой large-pr"
              exit 0
            fi
            echo "::error::PR на $lines строк больше предела $PR_HARD_LIMIT. Разрежьте на несколько PR или согласуйте метку large-pr."
            exit 1
          fi
          if [ "$lines" -gt "$PR_SOFT_LIMIT" ]; then
            echo "::warning::PR на $lines строк больше ориентира $PR_SOFT_LIMIT — подумайте, можно ли разрезать"
          fi

  review:
    # Каждый PR, готовый к ревью; черновики ждут. Смена меток ревью не перезапускает.
    if: >-
      github.event_name == 'pull_request' && github.event.pull_request.draft == false &&
      github.event.action != 'labeled' && github.event.action != 'unlabeled'
    runs-on: ubuntu-latest
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: No token secret
        if: env.CLAUDE_AUTH == ''
        run: echo "::notice::CLAUDE_CODE_OAUTH_TOKEN / ANTHROPIC_API_KEY is not set, Claude review skipped"

      - uses: actions/checkout@v4
        if: env.CLAUDE_AUTH != ''
        with:
          fetch-depth: 1

      - name: Claude review
        if: env.CLAUDE_AUTH != ''
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true
          claude_args: |
            --allowedTools "${{ env.REVIEW_TOOLS }}"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            BASE: ${{ github.event.pull_request.base.ref }}

            Сделай ревью этого pull request проекта СТРИЖ. Правила репозитория — CLAUDE.md и README.md,
            если они есть. Найди связанную задачу (`Closes ...#N` в описании PR), прочитай её через
            `gh issue view` и сверь PR с её объёмом и критериями приёмки.

            Сообщай только реальные проблемы, самые серьёзные первыми, каждую проверь по коду:
            1. Безопасность: секреты и токены в коде или логах, инъекции (SQL, JQL, CQL, shell),
               обход авторизации и изоляции команд, персональные данные в логах, небезопасная
               десериализация.
            2. Корректность: неверная логика, необработанные ошибки и таймауты внешних вызовов
               (Jira, Xray, Confluence, LLM), гонки, потеря данных, неидемпотентные повторы,
               удаление тестов в Jira (тесты только архивируются).
            3. Данные и совместимость: миграции без обратной совместимости или без отката,
               изменение контрактов API между сервисами без правки потребителей.
            4. Объём: одна задача — один небольшой PR; посторонние изменения, смешанные в одном PR
               рефакторинг и новая функциональность, ручная правка автоматических блоков README.
            5. Тесты: новое поведение без тестов, тесты, которые ничего не проверяют.
            6. Документация, которая теперь говорит неправду; новые переменные окружения
               без `.env.example`.

            Каждое замечание — inline-комментарий на точной строке: уровень (P0 — блокер,
            данные или безопасность; P1 — баг, чинить до мержа; P2 — стоит исправить; P3 — мелочь),
            однострочный заголовок, затем сценарий, при котором проблема проявится. В конце — один
            комментарий к PR: вердикт (можно мержить / нужны исправления), число замечаний по уровням
            и что проверено. Без похвалы, без замечаний по стилю, без пересказа диффа. Пиши по-русски.

  mention:
    # `@claude` в комментарии PR: вопрос или повторная проверка после исправлений.
    if: >-
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    steps:
      - name: No token secret
        if: env.CLAUDE_AUTH == ''
        run: echo "::notice::CLAUDE_CODE_OAUTH_TOKEN / ANTHROPIC_API_KEY is not set, @claude skipped"

      - uses: actions/checkout@v4
        if: env.CLAUDE_AUTH != ''
        with:
          fetch-depth: 1

      - name: Claude answers
        if: env.CLAUDE_AUTH != ''
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --allowedTools "${{ env.REVIEW_TOOLS }}"
            --append-system-prompt "Ты ревьюер: не правишь файлы и не пушишь коммиты. Уровни замечаний P0-P3 как в ревью PR. Отвечай на языке комментария, который тебя вызвал."
